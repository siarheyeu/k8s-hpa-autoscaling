apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hpa-demo-alerts
  namespace: hpa-demo
spec:
  groups:
  - name: hpa-demo
    rules:
    - alert: HighRequestLatency
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High request latency on HPA demo app"
    - alert: HPAMaxReplicasReached
      expr: kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler="hpa-demo-app"} >= 10
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "HPA reached max replicas"
