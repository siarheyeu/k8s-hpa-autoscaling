name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        cd app
        pip install -r requirements.txt

    - name: Lint
      run: |
        pip install flake8
        flake8 app/ --max-line-length=120

    - name: Build Docker image
      run: docker build -t k8s-hpa-autoscaling:test app/
